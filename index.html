<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plante Vagt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Space Grotesk"', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
                    },
                    colors: {
                        surface: '#f6f7f9',
                        panel: '#ffffff',
                        stroke: '#d4d4d8',
                        'stroke-dark': '#71717a',
                        ink: '#27272a',
                        'ink-muted': '#71717a',
                        charcoal: '#3f3f46'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f4f4f5; }
        ::-webkit-scrollbar-thumb { background: #a1a1aa; }
        ::-webkit-scrollbar-thumb:hover { background: #71717a; }
        * { border-radius: 0 !important; } /* Kantet, arkitektonisk design */
    </style>
</head>
<body class="bg-surface text-ink min-h-screen relative font-sans selection:bg-zinc-800 selection:text-white">

    <!-- LOGIN SCREEN -->
    <div id="auth-container" class="min-h-screen flex items-center justify-center p-4 z-50 bg-surface hidden">
        <div class="bg-panel p-8 w-full max-w-md border border-stroke shadow-[3px_3px_0px_0px_rgba(24,24,27,0.06)]">
            <div class="border-b border-stroke pb-5 mb-6 text-center">
                <span class="text-4xl block mb-2 opacity-90">🪴</span>
                <h1 class="text-xl font-bold tracking-tight text-ink">Plante Vagt</h1>
                <p class="text-ink-muted text-xs font-mono uppercase tracking-wider mt-1">Log ind på oversigten</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-ink-muted mb-1">Email</label>
                    <input type="email" id="auth-email" class="w-full border border-stroke px-3 py-2 bg-neutral-50/60 focus:bg-white focus:border-zinc-500 focus:outline-none text-sm text-ink transition-colors" placeholder="din@email.dk">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-ink-muted mb-1">Adgangskode</label>
                    <input type="password" id="auth-password" class="w-full border border-stroke px-3 py-2 bg-neutral-50/60 focus:bg-white focus:border-zinc-500 focus:outline-none text-sm text-ink transition-colors" placeholder="••••••••">
                </div>
                
                <div class="pt-2">
                    <button onclick="handleLogin()" class="w-full bg-zinc-800 hover:bg-zinc-700 text-white font-medium py-2.5 px-4 text-xs uppercase tracking-wider border border-zinc-800 transition-colors shadow-sm">
                        Log ind
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="app-container" class="hidden pb-24 md:pb-12">
        <header class="bg-panel border-b border-stroke sticky top-0 z-30 shadow-[0_1px_2px_rgba(0,0,0,0.03)]">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <span class="text-2xl">🌱</span>
                    <h1 class="text-lg sm:text-xl font-bold tracking-tight text-ink">Plante Vagt</h1>
                    <span class="hidden sm:inline-block text-[11px] font-mono border border-stroke px-2 py-0.5 bg-neutral-50 text-ink-muted uppercase">Arkiv</span>
                </div>
                <div class="flex items-center gap-2 sm:gap-3">
                    <button onclick="requestNotificationPermission()" class="border border-stroke bg-white hover:bg-neutral-100 text-ink px-3 py-1.5 text-xs font-medium uppercase tracking-wider transition-colors flex items-center gap-1.5" title="Slå notifikationer til">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-ink-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
                        <span class="hidden md:inline">Notifikationer</span>
                    </button>
                    <button onclick="openPlantModal()" class="bg-zinc-800 hover:bg-zinc-700 text-white border border-zinc-800 text-xs font-medium uppercase tracking-wider px-3.5 py-1.5 transition-colors flex items-center gap-1.5 shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg>
                        Ny Plante
                    </button>
                    <div class="w-px h-6 bg-stroke mx-1"></div>
                    <button onclick="handleLogout()" class="border border-stroke bg-white hover:bg-neutral-100 text-ink-muted hover:text-ink text-xs font-medium uppercase tracking-wider px-3 py-1.5 transition-colors">
                        Log ud
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <!-- Season Toggle UI (Dæmpet & Behageligt kantet) -->
            <div class="bg-panel border border-stroke p-4 mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-[2px_2px_0px_0px_rgba(24,24,27,0.04)]">
                <div>
                    <div class="flex items-center gap-2">
                        <span class="text-[11px] font-mono font-medium uppercase bg-zinc-800 text-zinc-100 px-2 py-0.5">Sæson</span>
                        <h2 id="active-season-badge" class="text-sm font-semibold tracking-wide text-ink">Aktiv: Sommer</h2>
                    </div>
                    <p class="text-xs font-mono text-ink-muted mt-1.5">
                        Sommer: 1. apr – 30. sep · Vinter: 1. okt – 31. mar
                    </p>
                </div>
                
                <div class="inline-flex border border-stroke p-1 bg-neutral-100 gap-1">
                    <button id="btn-summer" onclick="setSeason('summer')" class="px-3.5 py-1.5 text-xs font-medium uppercase tracking-wider transition-colors">
                        ☀️ Sommer (apr - sep)
                    </button>
                    <button id="btn-winter" onclick="setSeason('winter')" class="px-3.5 py-1.5 text-xs font-medium uppercase tracking-wider transition-colors">
                        ❄️ Vinter (okt - mar)
                    </button>
                </div>
            </div>
            
            <div id="plant-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                <!-- Plant cards will be injected here via JS -->
            </div>
        </main>

        <!-- Floating Action Button for Mobile -->
        <button onclick="openPlantModal()" class="sm:hidden fixed bottom-6 right-6 h-12 w-12 bg-zinc-800 text-white border border-zinc-700 shadow-md flex items-center justify-center z-30" title="Tilføj plante">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
        </button>
    </div>
    <!-- Modal: Add / Edit -->
    <div id="plant-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-neutral-900/40 backdrop-blur-xs" onclick="closePlantModal()"></div>
        <div class="fixed inset-0 flex items-center justify-center p-4">
            <div class="bg-panel border border-stroke shadow-[4px_4px_0px_0px_rgba(24,24,27,0.08)] w-full max-w-md overflow-hidden relative">
                <div class="px-5 py-3.5 border-b border-stroke flex justify-between items-center bg-neutral-50/80">
                    <h3 id="modal-title" class="text-sm font-semibold uppercase tracking-wider text-ink">Tilføj ny plante</h3>
                    <button onclick="closePlantModal()" class="text-ink-muted hover:text-ink p-1 border border-stroke hover:bg-neutral-100 transition-colors">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                </div>
                <div class="p-5 space-y-4 max-h-[75vh] overflow-y-auto">
                    <input type="hidden" id="p-id">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-ink-muted mb-1">Plantens navn</label>
                        <input type="text" id="p-name" class="w-full border border-stroke px-3 py-2 text-sm bg-neutral-50/50 focus:bg-white focus:border-zinc-500 focus:outline-none transition-colors" placeholder="F.eks. Monstera Deliciosa">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-ink-muted mb-1">Sommer (dage)</label>
                            <input type="number" id="p-water-summer" class="w-full border border-stroke px-3 py-2 text-sm bg-neutral-50/50 focus:bg-white focus:border-zinc-500 focus:outline-none transition-colors" min="1" placeholder="7">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-ink-muted mb-1">Vinter (dage)</label>
                            <input type="number" id="p-water-winter" class="w-full border border-stroke px-3 py-2 text-sm bg-neutral-50/50 focus:bg-white focus:border-zinc-500 focus:outline-none transition-colors" min="1" placeholder="14">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-ink-muted mb-1">Gødning (hver x dag)</label>
                        <input type="number" id="p-fert" class="w-full border border-stroke px-3 py-2 text-sm bg-neutral-50/50 focus:bg-white focus:border-zinc-500 focus:outline-none transition-colors" min="1" placeholder="F.eks. 14 (valgfrit)">
                        <p class="text-[11px] font-mono text-ink-muted mt-1">Gødning gælder og vises kun i sommerperioden.</p>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-ink-muted mb-1">Noter & pasningstips</label>
                        <textarea id="p-notes" rows="3" class="w-full border border-stroke px-3 py-2 text-sm bg-neutral-50/50 focus:bg-white focus:border-zinc-500 focus:outline-none transition-colors resize-none" placeholder="Trives lyst, ingen direkte sol..."></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-ink-muted mb-1">Billede</label>
                        <div class="flex items-center justify-center w-full">
                            <label class="flex flex-col items-center justify-center w-full h-24 border border-dashed border-stroke cursor-pointer bg-neutral-50/80 hover:bg-neutral-100 transition-colors">
                                <span class="text-xs font-mono font-medium text-ink-muted hover:text-ink underline">Vælg billedfil</span>
                                <input id="p-image" type="file" class="hidden" accept="image/*" onchange="previewImage(event)" />
                            </label>
                        </div>
                        <img id="image-preview" class="hidden mt-3 w-full h-32 object-cover border border-stroke">
                    </div>
                </div>
                <div class="px-5 py-3 border-t border-stroke flex justify-end gap-2 bg-neutral-50/80">
                    <button onclick="closePlantModal()" class="px-4 py-1.5 text-xs font-medium uppercase tracking-wider bg-white border border-stroke text-ink hover:bg-neutral-100 transition-colors">Annuller</button>
                    <button onclick="savePlantData()" class="px-4 py-1.5 text-xs font-medium uppercase tracking-wider text-white bg-zinc-800 border border-zinc-800 hover:bg-zinc-700 transition-colors shadow-sm">Gem Plante</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Delete -->
    <div id="delete-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-neutral-900/40 backdrop-blur-xs" onclick="closeDeleteModal()"></div>
        <div class="fixed inset-0 flex items-center justify-center p-4">
            <div class="bg-panel border border-stroke shadow-[4px_4px_0px_0px_rgba(24,24,27,0.08)] w-full max-w-sm p-6 text-center">
                <div class="text-2xl mb-2">⚠️</div>
                <h3 class="text-base font-semibold text-ink mb-1">Slet plante?</h3>
                <p class="text-xs font-mono text-ink-muted mb-5">Handlingen kan ikke fortrydes. Planten fjernes permanent.</p>
                <div class="flex gap-2">
                    <button onclick="closeDeleteModal()" class="flex-1 py-2 text-xs font-medium uppercase tracking-wider bg-white border border-stroke text-ink hover:bg-neutral-100 transition-colors">Nej, behold</button>
                    <button onclick="confirmDelete()" class="flex-1 py-2 text-xs font-medium uppercase tracking-wider text-white bg-red-700 border border-red-700 hover:bg-red-800 transition-colors">Ja, slet</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAuXoKwdJw4t0Z7AcFxD9sgB1obLXwvuhE",
            authDomain: "planteorg.firebaseapp.com",
            projectId: "planteorg",
            storageBucket: "planteorg.firebasestorage.app",
            messagingSenderId: "541919073169",
            appId: "1:541919073169:web:0ce8328fad7fa58d654030"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        setPersistence(auth, browserLocalPersistence).catch(console.error);

        // Dæmpet, rolig SVG placeholder i neutrale gråtoner
        const defaultSVG = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 200 200" fill="none"><rect width="200" height="200" fill="%23f1f3f5"/><rect x="12" y="12" width="176" height="176" stroke="%23cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M100 145 V65 M100 95 C82 85 68 95 68 112 C82 112 95 104 100 95 M100 112 C118 103 132 112 132 128 C118 128 105 120 100 112" stroke="%2364748b" stroke-width="2.5" stroke-linecap="square"/></svg>`;

        let plants = [];
        let plantToDeleteId = null;
        let activeImageBase64 = "";
        let unsubscribePlants = null;

        // Season Logic: Summer = April(3) - September(8)
        const currentMonth = new Date().getMonth();
        let currentSeason = (currentMonth >= 3 && currentMonth <= 8) ? 'summer' : 'winter';

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                
                updateSeasonToggleUI();
                
                unsubscribePlants = onSnapshot(collection(db, 'plants'), (snapshot) => {
                    plants = [];
                    snapshot.forEach((doc) => {
                        plants.push({ id: doc.id, ...doc.data() });
                    });
                    renderPlants();
                    setTimeout(checkNotifications, 2000);
                });
            } else {
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('app-container').classList.add('hidden');
                plants = [];
                renderPlants();
                if (unsubscribePlants) {
                    unsubscribePlants();
                    unsubscribePlants = null;
                }
            }
        });

        async function handleLogin() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            if(!email || !password) return showToast("Udfyld venligst begge felter", "error");
            
            try {
                await signInWithEmailAndPassword(auth, email, password);
                showToast("LOGGET IND", "success");
            } catch (error) {
                showToast("FEJL: UGYLDIG EMAIL ELLER KODE", "error");
            }
        }

        async function handleLogout() {
            try {
                await signOut(auth);
                document.getElementById('auth-email').value = '';
                document.getElementById('auth-password').value = '';
            } catch (error) {
                showToast("FEJL VED LOG UD", "error");
            }
        }

        function setSeason(season) {
            currentSeason = season;
            updateSeasonToggleUI();
            renderPlants();
        }

        function updateSeasonToggleUI() {
            const btnSummer = document.getElementById('btn-summer');
            const btnWinter = document.getElementById('btn-winter');
            const activeBadge = document.getElementById('active-season-badge');
            
            if (activeBadge) {
                activeBadge.textContent = currentSeason === 'summer' ? 'Aktiv: Sommer' : 'Aktiv: Vinter';
            }

            if (currentSeason === 'summer') {
                btnSummer.className = "px-3.5 py-1.5 text-xs font-semibold uppercase tracking-wider bg-zinc-800 text-white border border-zinc-800 shadow-xs";
                btnWinter.className = "px-3.5 py-1.5 text-xs font-medium uppercase tracking-wider text-ink-muted hover:text-ink border border-transparent";
            } else {
                btnWinter.className = "px-3.5 py-1.5 text-xs font-semibold uppercase tracking-wider bg-zinc-800 text-white border border-zinc-800 shadow-xs";
                btnSummer.className = "px-3.5 py-1.5 text-xs font-medium uppercase tracking-wider text-ink-muted hover:text-ink border border-transparent";
            }
        }

        function getDaysAgo(timestamp) {
            if (!timestamp) return 999;
            return Math.floor((Date.now() - timestamp) / 86400000);
        }

        function formatDaysText(days) {
            if (days === 0) return "I dag";
            if (days === 1) return "I går";
            if (days >= 999) return "Aldrig";
            return `${days} dage siden`;
        }

        // Toggle visning af fuld tekst ved klik
        window.togglePlantNote = function(id, event) {
            if (event) event.stopPropagation();
            const notePopup = document.getElementById(`note-popup-${id}`);
            if (notePopup) {
                notePopup.classList.toggle('hidden');
            }
        };

        function renderPlants() {
            const container = document.getElementById('plant-list');
            container.innerHTML = '';

            if (plants.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-16 text-center bg-panel border border-stroke shadow-[2px_2px_0px_0px_rgba(24,24,27,0.04)]">
                        <p class="font-mono text-sm uppercase tracking-wider text-ink-muted">Ingen planter fundet. Tilføj en plante for at begynde.</p>
                    </div>
                `;
                return;
            }

            plants.forEach(p => {
                const daysSinceWater = getDaysAgo(p.lastWatered);
                const daysSinceFert = getDaysAgo(p.lastFert);
                
                const summerDays = p.waterIntervalSummer || p.waterInterval;
                const winterDays = p.waterIntervalWinter || p.waterInterval;
                const activeWaterInterval = currentSeason === 'summer' ? summerDays : winterDays;

                const needsWater = activeWaterInterval ? (daysSinceWater >= activeWaterInterval) : false;
                const needsFert = (currentSeason === 'summer' && p.fertInterval) ? (daysSinceFert >= p.fertInterval) : false;

                const imgSrc = p.img ? p.img : defaultSVG;

                // Status badges: afdæmpede, klare uden at blænde
                let statusHTML = '';
                if (needsWater) {
                    statusHTML += `<span class="bg-amber-100/90 text-amber-900 border border-amber-300 text-[10px] font-mono font-semibold px-1.5 py-0.5 uppercase flex items-center gap-1"><span class="w-1.5 h-1.5 bg-amber-600 inline-block animate-pulse"></span>Vand nu</span>`;
                }
                if (needsFert) {
                    statusHTML += `<span class="bg-blue-50 text-blue-900 border border-blue-200 text-[10px] font-mono font-semibold px-1.5 py-0.5 uppercase flex items-center gap-1"><span class="w-1.5 h-1.5 bg-blue-600 inline-block"></span>Gød nu</span>`;
                }

                const fertStatusRow = (currentSeason === 'summer' && p.fertInterval) ? `
                    <div class="flex items-center justify-between px-2 py-1 text-xs border border-stroke/70 ${needsFert ? 'bg-amber-50/70 text-amber-900 font-semibold' : 'bg-neutral-50/60 text-ink'}">
                        <span class="font-mono uppercase text-[11px] text-ink-muted">🧪 Gødet:</span>
                        <span class="font-mono text-[11px] font-medium">${formatDaysText(daysSinceFert)}</span>
                    </div>
                ` : '';

                const fertButton = (currentSeason === 'summer' && p.fertInterval) ? `
                    <button onclick="waterPlant('${p.id}', true)" class="bg-neutral-100 hover:bg-neutral-200 text-ink border border-stroke font-medium py-1.5 px-2 text-xs uppercase tracking-wider transition-colors">
                        + Gødning
                    </button>
                ` : '';

                const buttonsGridClass = (currentSeason === 'summer' && p.fertInterval) ? 'grid-cols-2' : 'grid-cols-1';

                container.innerHTML += `
                    <div class="bg-panel border border-stroke p-3.5 shadow-[2px_2px_0px_0px_rgba(24,24,27,0.04)] flex flex-col justify-between relative hover:border-zinc-400 transition-colors">
                        <div>
                            <!-- Header med kvadratisk billede & detaljer -->
                            <div class="flex items-start gap-3 mb-3">
                                <div class="w-20 h-20 flex-shrink-0 bg-neutral-100 border border-stroke overflow-hidden relative">
                                    <img src="${imgSrc}" class="w-full h-full object-cover" alt="${p.name}">
                                </div>

                                <div class="flex-1 min-w-0">
                                    <div class="flex items-start justify-between gap-1">
                                        <h3 class="text-sm font-semibold tracking-tight truncate text-ink" title="${p.name}">
                                            ${p.name}
                                        </h3>
                                        <div class="flex items-center gap-1 flex-shrink-0">
                                            <button onclick="openPlantModal('${p.id}')" class="border border-stroke p-1 text-ink-muted hover:text-ink hover:bg-neutral-100 transition-colors" title="Rediger">
                                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                            </button>
                                            <button onclick="openDeleteModal('${p.id}')" class="border border-stroke p-1 text-ink-muted hover:text-red-700 hover:bg-neutral-100 transition-colors" title="Slet">
                                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                            </button>
                                        </div>
                                    </div>

                                    <!-- Status indikatorer -->
                                    <div class="flex flex-wrap items-center gap-1 mt-1.5">
                                        ${statusHTML}
                                        <span class="text-[10px] font-mono font-medium border border-stroke bg-neutral-50 px-1.5 py-0.5 text-ink-muted">
                                            Hver ${activeWaterInterval || '-'}d
                                        </span>
                                    </div>

                                    <!-- Sæson info med rolig kontrast -->
                                    <div class="text-[10px] font-mono text-ink-muted mt-1.5 flex items-center gap-1.5">
                                        <span class="${currentSeason === 'summer' ? 'font-semibold text-ink underline decoration-zinc-400 underline-offset-2' : ''}">S:${summerDays || '-'}d</span>
                                        <span class="text-zinc-300">/</span>
                                        <span class="${currentSeason === 'winter' ? 'font-semibold text-ink underline decoration-zinc-400 underline-offset-2' : ''}">V:${winterDays || '-'}d</span>
                                        ${p.fertInterval ? `<span class="text-zinc-300">/</span><span class="${currentSeason === 'summer' ? 'font-semibold text-ink underline decoration-zinc-400 underline-offset-2' : ''}">G:${p.fertInterval}d</span>` : ''}
                                    </div>
                                </div>
                            </div>

                            <!-- INTERAKTIV NOTE-SEKTION (HOVER OG KLIK) -->
                            ${p.notes ? `
                            <div class="relative mb-3 group/info">
                                <div onclick="togglePlantNote('${p.id}', event)" class="cursor-pointer border border-stroke bg-neutral-50/70 hover:bg-neutral-100 px-2 py-1.5 flex items-center justify-between text-xs transition-colors select-none" title="Klik for at folde ud/ind">
                                    <div class="flex items-center gap-1.5 min-w-0 pr-1">
                                        <span class="inline-flex items-center justify-center w-4 h-4 bg-zinc-700 text-white font-mono text-[10px] font-medium flex-shrink-0">i</span>
                                        <span class="truncate font-mono text-[11px] text-ink-muted">${p.notes}</span>
                                    </div>
                                    <span class="text-[9px] font-mono uppercase text-ink-muted hover:text-ink flex-shrink-0 underline">Læs</span>
                                </div>

                                <!-- HOVER TOOLTIP (Behagelig mørkegrå baggrund med blød skygge) -->
                                <div class="hidden group-hover/info:block pointer-events-none absolute left-0 right-0 bottom-full mb-1.5 z-40 bg-zinc-800 text-zinc-100 p-2.5 text-xs font-mono border border-zinc-700 shadow-md">
                                    <div class="text-[10px] uppercase font-medium text-zinc-400 mb-1 border-b border-zinc-700 pb-0.5">Note</div>
                                    <p class="leading-relaxed whitespace-pre-wrap">${p.notes}</p>
                                </div>

                                <!-- KLIK-UDVIDET MODUS -->
                                <div id="note-popup-${p.id}" class="hidden mt-1.5 bg-panel border border-stroke p-2.5 text-xs font-mono shadow-[2px_2px_0px_0px_rgba(24,24,27,0.04)]">
                                    <div class="flex items-center justify-between border-b border-stroke pb-1 mb-1.5">
                                        <span class="font-semibold uppercase text-[10px] text-ink">Note detaljer</span>
                                        <button onclick="togglePlantNote('${p.id}', event)" class="text-[10px] text-ink-muted hover:text-ink uppercase underline">Luk [X]</button>
                                    </div>
                                    <p class="text-ink leading-relaxed whitespace-pre-wrap">${p.notes}</p>
                                </div>
                            </div>
                            ` : ''}

                            <!-- Sidst vandet status -->
                            <div class="space-y-1 mb-3">
                                <div class="flex items-center justify-between px-2 py-1 text-xs border border-stroke/70 ${needsWater ? 'bg-amber-50/80 text-amber-950 font-semibold' : 'bg-neutral-50/50 text-ink'}">
                                    <span class="font-mono uppercase text-[11px] text-ink-muted">💧 Vandet:</span>
                                    <span class="font-mono text-[11px] font-medium">${formatDaysText(daysSinceWater)}</span>
                                </div>
                                ${fertStatusRow}
                            </div>
                        </div>

                        <!-- Handlingsknapper -->
                        <div class="grid ${buttonsGridClass} gap-1.5 pt-1">
                            <button onclick="waterPlant('${p.id}', false)" class="bg-zinc-800 hover:bg-zinc-700 text-white border border-zinc-800 font-medium py-1.5 px-3 text-xs uppercase tracking-wider transition-colors shadow-xs">
                                Vand
                            </button>
                            ${fertButton}
                        </div>
                    </div>
                `;
            });
        }
        async function waterPlant(id, withFertilizer) {
            const plant = plants.find(p => p.id === id);
            if (!plant) return;
            
            try {
                const plantRef = doc(db, 'plants', id);
                const updates = { lastWatered: Date.now() };
                if(withFertilizer && plant.fertInterval && currentSeason === 'summer') {
                    updates.lastFert = Date.now();
                }
                
                await updateDoc(plantRef, updates);
                showToast(`${plant.name} opdateret`, "success");
            } catch (error) {
                showToast("Fejl ved opdatering", "error");
            }
        }

        function showToast(message, type = "info") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'error' ? 'bg-red-800 text-white border-red-700' : 'bg-zinc-800 text-zinc-100 border-zinc-700';
            toast.className = `${bgClass} border px-3.5 py-2 shadow-md text-xs font-mono uppercase tracking-wider transform transition-all duration-200 translate-y-2 opacity-0 pointer-events-auto`;
            toast.innerHTML = message;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 250);
            }, 3000);
        }

        function openPlantModal(id = null) {
            document.getElementById('p-id').value = '';
            document.getElementById('p-name').value = '';
            document.getElementById('p-water-summer').value = '';
            document.getElementById('p-water-winter').value = '';
            document.getElementById('p-fert').value = '';
            document.getElementById('p-notes').value = '';
            document.getElementById('p-image').value = '';
            document.getElementById('image-preview').classList.add('hidden');
            activeImageBase64 = "";

            if (id) {
                const plant = plants.find(p => p.id === id);
                if(plant) {
                    document.getElementById('modal-title').innerText = "Rediger Plante";
                    document.getElementById('p-id').value = plant.id;
                    document.getElementById('p-name').value = plant.name;
                    
                    document.getElementById('p-water-summer').value = plant.waterIntervalSummer || plant.waterInterval || '';
                    document.getElementById('p-water-winter').value = plant.waterIntervalWinter || plant.waterInterval || '';
                    
                    document.getElementById('p-fert').value = plant.fertInterval || '';
                    document.getElementById('p-notes').value = plant.notes || '';
                    if (plant.img) {
                        activeImageBase64 = plant.img;
                        const preview = document.getElementById('image-preview');
                        preview.src = plant.img;
                        preview.classList.remove('hidden');
                    }
                }
            } else {
                document.getElementById('modal-title').innerText = "Tilføj ny plante";
            }
            document.getElementById('plant-modal').classList.remove('hidden');
        }

        function closePlantModal() {
            document.getElementById('plant-modal').classList.add('hidden');
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_WIDTH = 400;
                    const MAX_HEIGHT = 400;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    activeImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    const preview = document.getElementById('image-preview');
                    preview.src = activeImageBase64;
                    preview.classList.remove('hidden');
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        async function savePlantData() {
            if(!auth.currentUser) return showToast("DU SKAL VÆRE LOGGET IND", "error");

            const id = document.getElementById('p-id').value;
            const name = document.getElementById('p-name').value.trim();
            const waterSummer = parseInt(document.getElementById('p-water-summer').value);
            const waterWinter = parseInt(document.getElementById('p-water-winter').value);
            const fert = document.getElementById('p-fert').value ? parseInt(document.getElementById('p-fert').value) : null;
            const notes = document.getElementById('p-notes').value.trim();

            if(!name || isNaN(waterSummer) || isNaN(waterWinter)) {
                showToast("UDFYLD NAVN OG BEGGE VANDINGS-DAGE", "error");
                return;
            }

            try {
                if (id) {
                    const plantRef = doc(db, 'plants', id);
                    const updatePayload = {
                        name: name,
                        waterIntervalSummer: waterSummer,
                        waterIntervalWinter: waterWinter,
                        waterInterval: waterSummer,
                        fertInterval: fert,
                        notes: notes
                    };
                    if (activeImageBase64) {
                        updatePayload.img = activeImageBase64;
                    }
                    await updateDoc(plantRef, updatePayload);
                    showToast("PLANTE OPDATERET", "success");
                } else {
                    await addDoc(collection(db, 'plants'), {
                        name: name,
                        waterIntervalSummer: waterSummer,
                        waterIntervalWinter: waterWinter,
                        waterInterval: waterSummer, 
                        fertInterval: fert,
                        notes: notes,
                        lastWatered: Date.now(),
                        lastFert: Date.now(),
                        img: activeImageBase64
                    });
                    showToast("PLANTE TILFØJET", "success");
                }
                closePlantModal();
            } catch (error) {
                console.error(error);
                showToast("FEJL VED GEMNING", "error");
            }
        }

        function openDeleteModal(id) {
            plantToDeleteId = id;
            document.getElementById('delete-modal').classList.remove('hidden');
        }

        function closeDeleteModal() {
            plantToDeleteId = null;
            document.getElementById('delete-modal').classList.add('hidden');
        }

        async function confirmDelete() {
            if (plantToDeleteId) {
                try {
                    await deleteDoc(doc(db, 'plants', plantToDeleteId));
                    closeDeleteModal();
                    showToast("PLANTE SLETTET", "info");
                } catch (error) {
                    showToast("FEJL VED SLETNING", "error");
                }
            }
        }

        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if(permission === "granted") showToast("NOTIFIKATIONER SLÅET TIL", "success");
                    else showToast("NOTIFIKATIONER BLEV AFVIST", "error");
                });
            }
        }

        function checkNotifications() {
            if (!("Notification" in window) || Notification.permission !== "granted") return;
            
            let alerts = [];
            plants.forEach(p => {
                const activeWaterInterval = currentSeason === 'summer' 
                    ? (p.waterIntervalSummer || p.waterInterval) 
                    : (p.waterIntervalWinter || p.waterInterval);
                
                if (activeWaterInterval && getDaysAgo(p.lastWatered) >= activeWaterInterval) {
                    alerts.push(p.name);
                }
            });

            if (alerts.length > 0) {
                new Notification("Plante Vagt", {
                    body: `Vandingstid: ${alerts.join(', ')}`,
                    icon: "data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>"
                });
            }
        }

        // Gør funktioner tilgængelige for HTML onclick
        window.handleLogin = handleLogin;
        window.handleLogout = handleLogout;
        window.setSeason = setSeason;
        window.requestNotificationPermission = requestNotificationPermission;
        window.openPlantModal = openPlantModal;
        window.closePlantModal = closePlantModal;
        window.previewImage = previewImage;
        window.savePlantData = savePlantData;
        window.openDeleteModal = openDeleteModal;
        window.closeDeleteModal = closeDeleteModal;
        window.confirmDelete = confirmDelete;
        window.waterPlant = waterPlant;
    </script>
</body>
</html>
